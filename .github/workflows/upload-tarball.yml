name: upload-tarball
on:
  push:
    branches: [feature/prebuilds]
jobs:
  upload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm pack
      - run: npm run build
      - run: ls -R prebuilds
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: 'runbotics-winax-*.tgz*'
